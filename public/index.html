<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Элементар · Планер</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%22-240.8%20-240.8%20481.6%20481.6%22%3E%3Cpath%20d%3D%22M-210%20-120a170%2070%200%201%200%20340%200a170%2070%200%201%200-340%200Z%22%20transform%3D%22translate%2816.8%2016.8%29%22%20fill%3D%22none%22%20stroke%3D%22%231F5BFF%22%20stroke-width%3D%2224%22/%3E%3Cpath%20d%3D%22M-210%20-120a170%2070%200%201%200%20340%200a170%2070%200%201%200-340%200Z%22%20fill%3D%22none%22%20stroke%3D%22%23111%22%20stroke-width%3D%2224%22/%3E%3Cpath%20d%3D%22M50%20-40a70%20170%200%201%200%20140%200a70%20170%200%201%200-140%200Z%22%20fill%3D%22none%22%20stroke%3D%22%23111%22%20stroke-width%3D%2224%22/%3E%3Cpath%20d%3D%22M-130%20120a170%2070%200%201%200%20340%200a170%2070%200%201%200-340%200Z%22%20fill%3D%22none%22%20stroke%3D%22%23111%22%20stroke-width%3D%2224%22/%3E%3Cpath%20d%3D%22M-190%2040a70%20170%200%201%200%20140%200a70%20170%200%201%200-140%200Z%22%20fill%3D%22none%22%20stroke%3D%22%23111%22%20stroke-width%3D%2224%22/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F3F1EC; --card:#FFFFFF; --ink:#17171B; --ink2:#55545B; --ink3:#8E8C94;
  --line:#E3E0D9; --line2:#D2CEC5; --accent:#FF4F1F; --accent-ink:#C2360F;
  --ok:#1F8A57; --warn:#B7790A; --warn-bg:#FFF4D9; --bad:#D22F33; --bad-bg:#FDE8E8;
  --soon:#3A5BD9; --soon-bg:#EAEFFF;
  --r:12px; --shadow:0 1px 0 rgba(23,23,27,.04),0 6px 18px -10px rgba(23,23,27,.18);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font:500 14px/1.45 Manrope,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
.mono{font-family:"JetBrains Mono",ui-monospace,monospace;font-feature-settings:"tnum"}
button{cursor:pointer}

/* header */
header{position:sticky;top:0;z-index:20;background:rgba(243,241,236,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:16px;padding:12px 20px;max-width:1600px;margin:0 auto;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:-.01em;font-size:16px}
.el{width:34px;height:34px;border:1.5px solid var(--ink);border-radius:6px;display:grid;place-items:center;position:relative;font-weight:800;font-size:14px;background:var(--card)}
.el::before{content:"1";position:absolute;top:1px;left:3px;font:600 7px "JetBrains Mono",monospace;color:var(--ink3)}
.logo small{display:block;font-weight:500;font-size:11px;color:var(--ink3);letter-spacing:.02em}
.tabs{display:flex;gap:2px;background:#E8E5DE;padding:3px;border-radius:10px}
.tabs button{border:0;background:transparent;padding:6px 12px;border-radius:8px;font-weight:600;color:var(--ink2)}
.tabs button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.spacer{flex:1}
.search{border:1px solid var(--line2);background:var(--card);border-radius:10px;padding:7px 12px;flex:1;min-width:180px;outline:none}
.search:focus{border-color:var(--ink)}
.btn{border:1px solid var(--line2);background:var(--card);border-radius:10px;padding:7px 14px;font-weight:600;white-space:nowrap}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.primary:hover{background:#000}
.btn.accent{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink2)}
.btn.ghost:hover{color:var(--ink);border-color:var(--line2)}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* sub bar */
.sub{display:flex;align-items:center;gap:8px;padding:0 20px 12px;max-width:1600px;margin:0 auto;flex-wrap:wrap}
.chip{border:1px solid var(--line2);background:transparent;border-radius:10px;padding:4px 10px 4px 4px;display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:13px;color:var(--ink2)}
.chip.plain{padding:4px 10px}
.chip[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}

.stats{display:flex;gap:18px;align-items:baseline;flex-wrap:wrap}
.stats-box{margin-left:auto}
.stats{flex-wrap:nowrap}
.stat{white-space:nowrap}
.stat .ss{display:none}
@media (max-width:900px){ .bar{flex-wrap:nowrap;gap:10px} .logo>div:last-child{display:none} }
@media (max-width:480px){ .tabs button{padding:6px 8px} .stats{gap:7px} }
.bar:has(.bar > .search) .stats-box{margin-left:0}
.stat{display:flex;gap:6px;align-items:baseline;color:var(--ink2);font-size:12px}
.stat b{font:600 18px "JetBrains Mono",monospace;color:var(--ink)}
.stat.bad b{color:var(--bad)}
.note{max-width:1600px;margin:0 auto 0;padding:8px 20px;font-size:12.5px;color:var(--ink2);display:flex;gap:8px;align-items:center}
.note.warn{background:var(--warn-bg);color:#6B4A00}

main{max-width:1600px;margin:0 auto;padding:16px 20px 60px}

/* element symbol */
.sym{width:22px;height:22px;border-radius:6px;display:inline-grid;place-items:center;font-weight:800;font-size:11px;border:1.5px solid currentColor;flex:none;background:var(--card)}

/* board */
.board-top{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:10px}
.new-col .ns{display:none}
.board-top .search{grid-column:2/5;grid-row:1;width:100%;min-width:0;padding:11px 14px;border-radius:12px;font-size:14px}
.new-col{grid-column:1;grid-row:1;padding:11px 14px;font-size:14px;border-radius:12px}
@media (max-width:560px){.board-top{grid-template-columns:1fr}.board-top .search{grid-column:1;grid-row:2}}
.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;align-items:start;overflow-x:auto;padding-bottom:8px}
.col{background:#EBE8E1;border-radius:14px;padding:10px;min-height:200px;transition:background .15s,outline-color .15s;outline:2px dashed transparent;outline-offset:-2px}
.col.over{background:#E2DED5;outline-color:var(--ink3)}
.col-h{display:flex;align-items:center;gap:8px;padding:4px 6px 2px}
.col-name{font-weight:800;font-size:13px;letter-spacing:.02em;text-transform:uppercase}
.col-n{font-size:12px;color:var(--ink3)}
.col-dot{width:8px;height:8px;border-radius:50%;background:var(--ink3)}
.col[data-st="work"] .col-dot{background:var(--soon)}
.col[data-st="review"] .col-dot{background:var(--warn)}
.col[data-st="done"] .col-dot{background:var(--ok)}
.col-hint{font-size:11.5px;color:var(--ink3);padding:0 6px 8px}
.col-body{display:flex;flex-direction:column;gap:8px}
.empty{font-size:12.5px;color:var(--ink3);padding:18px 8px;text-align:center;border:1px dashed var(--line2);border-radius:10px}
.more{font-size:12px;color:var(--ink2);background:none;border:0;padding:6px;text-decoration:underline}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:11px 12px 10px;box-shadow:var(--shadow);cursor:pointer;position:relative;text-align:left;width:100%;display:block}
.card:hover{border-color:var(--line2)}
.card:focus-visible{outline:2px solid var(--ink);outline-offset:1px}
.card{box-shadow:inset 4px 0 0 var(--bc,#CFCBC2),var(--shadow);padding-left:15px}
.card.dragging{opacity:.4}
.card.done .c-title{color:var(--ink2);text-decoration:line-through;text-decoration-color:var(--line2)}
.c-top{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--ink2);margin-bottom:6px}
.c-brand{font-weight:700;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.c-kind{color:var(--ink3);white-space:nowrap}
.c-title{font-weight:700;font-size:14.5px;line-height:1.35;letter-spacing:-.005em;overflow-wrap:break-word;hyphens:auto}
.c-bot{display:flex;align-items:center;gap:6px;margin-top:9px}
.due{font:600 11.5px "JetBrains Mono",monospace;padding:2px 7px;border-radius:6px;background:#F0EEE9;color:var(--ink2);white-space:nowrap}
.due.bad{background:var(--bad-bg);color:var(--bad)}
.due.warn{background:var(--warn-bg);color:var(--warn)}
.due.soon{background:var(--soon-bg);color:var(--soon)}
.due.none{background:transparent;color:var(--ink3);padding-left:0}
.prio{font-size:11px;font-weight:700;color:var(--accent-ink);white-space:nowrap}
.prio.high{color:var(--warn)}
.ava{width:22px;height:22px;border-radius:50%;background:#DCD8CF;color:var(--ink);display:inline-grid;place-items:center;font-size:10px;font-weight:800;flex:none;margin-left:auto}
.ava.me{background:var(--ink);color:#fff}

/* grouped columns */
.col-body.grouped{gap:12px}
.grp-b{display:flex;flex-direction:column;gap:6px;padding:8px 6px 6px;border-radius:12px;background:var(--lt);border:1.5px solid var(--lc)}
.grp-b .card{box-shadow:var(--shadow);padding-left:12px}
.grp-h{display:flex;align-items:center;gap:7px;padding:0 4px 2px}
.grp-name{font-weight:800;font-size:12.5px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.grp-n{font-size:11.5px;color:var(--ink2)}
.grp-b .c-top .sym,.grp-b .c-brand{display:none}
.grp-b .c-top:not(:has(.c-kind)){display:none}
.grp-b .c-kind{font-size:11.5px}
.grp-b .c-top{margin-bottom:3px}
/* lanes */
.lanes-head{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;padding:0 13px 8px}
.lanes-head .col-h{background:#EBE8E1;border-radius:10px;padding:8px 10px}
.lanes{display:flex;flex-direction:column;gap:14px;overflow-x:auto}
.lane{border-radius:16px;padding:12px;background:var(--lt);border:1px solid var(--lb);border-top:4px solid var(--lc)}
.lane-h{display:flex;align-items:center;gap:10px;margin:0 2px 10px}
.lane-h .sym{width:28px;height:28px;font-size:12px;border-radius:7px}
.lane-name{font-weight:800;font-size:16px;letter-spacing:-.01em}
.lane-meta{font-size:12px;color:var(--ink2);display:flex;gap:12px;margin-left:6px}
.lane-meta .bad{color:var(--bad);font-weight:700}
.lane-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.cell{min-height:64px;border-radius:12px;padding:6px;display:flex;flex-direction:column;gap:8px;background:rgba(255,255,255,.45);outline:2px dashed transparent;outline-offset:-2px;transition:outline-color .15s,background .15s}
.cell.over{outline-color:var(--lc);background:rgba(255,255,255,.75)}
.cell .empty{padding:10px 6px;border:0;font-size:12px}
.lane.quiet{padding:10px 12px}
.lane.quiet .lane-h{margin:0}
.lane-toggle{margin-left:auto}
.lane .c-top .sym,.lane .c-brand{display:none}
.lane .c-top:not(:has(.c-kind)){display:none}
.lane .c-kind{font-size:11.5px}
@media (max-width:760px){ .lanes-head,.lane-grid{gap:6px} .lanes-head .col-h{padding:6px} .lanes-head .col-name{font-size:10.5px} .lanes-head .col-dot{display:none} .cell{padding:4px} .lane{padding:10px 8px} .lanes-head{padding:0 9px 8px} .lane .card{padding:9px 8px 8px 11px} .lane .c-title{font-size:13px} .lane .due{font-size:10.5px;padding:2px 5px} .lane .ava{display:none} }

/* list */
table.fixed{table-layout:fixed}
tr.grp td{background:#FAF9F6;padding:7px 12px;border-bottom:1px solid var(--line)}
tr.grp:hover{background:#FAF9F6}

table{width:100%;border-collapse:collapse;background:var(--card);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink3);font-weight:700;background:#FAF9F6}
tbody tr{cursor:pointer}
tbody tr:hover{background:#FAF9F6}
td.num{text-align:right;font-family:"JetBrains Mono",monospace}
th.num{text-align:right}
.st{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600}
.st i{width:8px;height:8px;border-radius:50%;background:var(--ink3)}
.st.work i{background:var(--soon)} .st.review i{background:var(--warn)} .st.done i{background:var(--ok)}

/* load */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;box-shadow:var(--shadow)}
.panel h3{margin:0 0 2px;font-size:15px;font-weight:800;letter-spacing:-.01em}
.panel .cap{margin:0 0 14px;font-size:12.5px;color:var(--ink3)}
.wide{grid-column:1/-1}
.chart{position:relative;display:flex;align-items:flex-end;gap:2px;height:170px;padding-top:14px;border-bottom:1px solid var(--line2)}
.chart .bcol{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;position:relative}
.chart .b{width:min(70%,26px);background:var(--ink);border-radius:4px 4px 0 0;min-height:0}
.chart .b.bad{background:var(--bad)}
.chart .b.hot{background:var(--accent)}
.chart .b.muted{background:#BDB9B0}
.chart .v{font:600 11px "JetBrains Mono",monospace;color:var(--ink2);margin-bottom:3px}
.chart .bcol:hover .b{filter:brightness(1.25)}
.chart .hit{position:absolute;inset:0}
.xl{display:flex;gap:2px;margin-top:6px}
.xl span{flex:1;text-align:center;font:500 10.5px "JetBrains Mono",monospace;color:var(--ink3);white-space:nowrap}
.xl span.we{color:#C2BEB5}
.xl span.today{color:var(--ink);font-weight:600}
.norm{position:absolute;left:0;right:0;border-top:1.5px dashed var(--accent);pointer-events:none}
.norm span{position:absolute;right:0;top:-18px;font-size:11px;color:var(--accent-ink);font-weight:700;background:var(--card);padding:0 4px}
.legend-row{display:flex;gap:14px;margin-top:10px;font-size:12px;color:var(--ink2);flex-wrap:wrap}
.legend-row i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.tip{position:fixed;z-index:60;pointer-events:none;background:var(--ink);color:#fff;font-size:12px;padding:6px 9px;border-radius:8px;max-width:240px;opacity:0;transition:opacity .1s}
.tip.on{opacity:1}
.normset{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ink2)}
.normset input{width:52px;border:1px solid var(--line2);border-radius:8px;padding:3px 6px;background:var(--card)}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(23,23,27,.28);z-index:40;opacity:0;pointer-events:none;transition:opacity .15s}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(600px,100%);background:var(--paper);z-index:50;transform:translateX(102%);transition:transform .2s ease;display:flex;flex-direction:column;border-left:1px solid var(--line2)}
.drawer.on{transform:none}
.d-head{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line);background:var(--card)}
.d-head h2{margin:0;font-size:15px;font-weight:800;flex:1}
.d-body{flex:1;overflow:auto;padding:18px}
.d-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:12px 18px;border-top:1px solid var(--line);background:var(--card)}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.field label{font-size:11.5px;font-weight:700;color:var(--ink2);text-transform:uppercase;letter-spacing:.04em}
.field input,.field select,.field textarea{border:1px solid var(--line2);background:var(--card);border-radius:10px;padding:8px 11px;outline:none;width:100%}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--ink)}
.field textarea{min-height:90px;resize:vertical}
.field input.title-in{font-size:17px;font-weight:700}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row3{display:grid;grid-template-columns:1.3fr .8fr 1fr;gap:10px}
.brand-pick{display:flex;flex-wrap:wrap;gap:6px}
.brand-pick .chip{background:var(--card)}
.brand-pick .chip[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.brand-pick .chip:disabled{cursor:default;opacity:.7}
.brand-pick .chip:disabled[aria-pressed="true"]{opacity:1}
.prio-pick{display:flex;gap:4px}
.prio-pick button{flex:1;border:1px solid var(--line2);background:var(--card);border-radius:9px;padding:7px 4px;font-size:12.5px;font-weight:600;color:var(--ink2)}
.prio-pick button[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.prio-pick button.fire[aria-pressed="true"]{background:var(--accent);border-color:var(--accent)}
.meta{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--ink2);margin:-4px 0 14px}
.meta b{color:var(--ink);font-weight:700}
.flow{display:flex;gap:4px;margin-bottom:16px}
.flow span{flex:1;text-align:center;font-size:11.5px;font-weight:700;padding:6px 4px;border-radius:8px;background:#E8E5DE;color:var(--ink3)}
.flow span.past{background:#DCD8CF;color:var(--ink2)}
.flow span.cur{background:var(--ink);color:#fff}
.sec-t{font-size:11.5px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--ink3);margin:20px 0 10px}
.log{display:flex;flex-direction:column;gap:10px}
.log-i{display:flex;gap:10px}
.log-i .ava{margin:0}
.log-i .bub{flex:1;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 11px}
.log-i.event .bub{background:transparent;border:0;padding:3px 0;color:var(--ink2);font-size:12.5px}
.log-i.ret .bub{border-color:#F3C2B3;background:#FFF5F1}
.bub .who{font-weight:700;font-size:12.5px}
.bub .when{font:500 11px "JetBrains Mono",monospace;color:var(--ink3);margin-left:6px}
.bub .txt{white-space:pre-wrap;word-break:break-word;margin-top:2px}
.compose{display:flex;gap:8px;margin-top:12px;align-items:flex-end}
.compose textarea{flex:1;min-height:44px;max-height:160px;border:1px solid var(--line2);border-radius:10px;padding:9px 11px;background:var(--card);outline:none;resize:vertical}
.compose textarea:focus{border-color:var(--ink)}
.readonly .field input:disabled,.readonly .field textarea:disabled,.readonly .field select:disabled{background:transparent;border-color:transparent;padding-left:0;opacity:1;color:var(--ink);resize:none}
.readonly .field textarea:disabled{min-height:0}
.readonly ::placeholder{color:transparent}
.readonly .field input.title-in:disabled{font-size:18px}
.readonly .prio-pick button:disabled:not([aria-pressed="true"]){display:none}
.readonly .prio-pick button:disabled{flex:none;padding:5px 12px}
.readonly .brand-pick .chip:disabled:not([aria-pressed="true"]){display:none}
.hist-box{margin-top:22px;border-top:1px solid var(--line);padding-top:12px}
.hist-box summary{cursor:pointer;font-size:11.5px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--ink3);list-style:none}
.hist-box summary::before{content:"▸ ";}
.hist-box[open] summary::before{content:"▾ ";}
.hist{display:flex;flex-direction:column;gap:4px;margin-top:10px}
.hist-i{display:flex;gap:10px;font-size:12.5px;color:var(--ink2);align-items:baseline}
.hist-i .when{font:500 11px "JetBrains Mono",monospace;color:var(--ink3);white-space:nowrap;min-width:92px}
.hist-t{flex:1}
.hist-w{color:var(--ink3);white-space:nowrap}
.tag-ret{font-size:10.5px;font-weight:800;text-transform:uppercase;color:var(--accent-ink);background:#FFE6DC;border-radius:5px;padding:1px 6px;margin-left:8px}
.linkout{font-size:12.5px;color:var(--soon);word-break:break-all}
.ask{display:none;flex-direction:column;gap:8px;width:100%}
.ask.on{display:flex}
.ask textarea{border:1px solid var(--line2);border-radius:10px;padding:8px 11px;min-height:60px;background:#fff;outline:none}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:9px 14px;border-radius:10px;font-size:13px;z-index:70;opacity:0;transition:.2s;pointer-events:none}

<script>
/* ============ constants ============ */
const STATUSES=[
  {id:'new',   name:'Новые',       hint:'Поставлены, ещё не взяты в работу'},
  {id:'work',  name:'В работе',    hint:'Дизайнер делает'},
  {id:'review',name:'На проверке', hint:'Ждут решения того, кто поставил'},
  {id:'done',  name:'Готово',      hint:'Приняты'}
];
const ST_NAME=Object.fromEntries(STATUSES.map(s=>[s.id,s.name]));
const KINDS=['Макет','Баннер','Соцсети','Презентация','Наружка','Полиграфия','Сайт','Другое'];
const PRIOS=[['normal','Обычный'],['fire','Горит']];
const PRIO_NAME=Object.fromEntries(PRIOS);
const PRIO_RANK={fire:0,normal:1};
const SIZES=[['S',1,'около часа'],['M',3,'пара-тройка часов'],['L',5,'полдня'],['XL',8,'день и больше']];
const SIZE_H=Object.fromEntries(SIZES.map(([k,hh])=>[k,hh]));
const sizeLabel=k=>k&&SIZE_H[k]?`${k} · ${SIZE_H[k]} ч`:'';
function fmtDur(ms){ if(!ms||ms<60e3) return ms?'<1 мин':'—'; const m=Math.round(ms/60e3); if(m<60) return m+' мин'; const hh=Math.round(m/60); if(hh<24) return hh+' ч'; const d=Math.floor(hh/24), r=hh%24; return d+' д'+(r?' '+r+' ч':''); }
function tStats(t){ const st=t.stats||{}; const now=Date.now(); const live=t.status==='review'?Math.max(0,now-(t.statusAt||now)):0; return {rounds:st.rounds||0,reviewMs:(st.reviewMs||0)+live,reschedules:st.reschedules||0,onTime:t.status==='done'?(st.onTime===undefined?null:st.onTime):(isOver(t)?false:null)}; }
const hoursOf=list=>list.reduce((a,t)=>a+(SIZE_H[t.size]||0),0);
const BRAND_HUES=['#2F5BD3','#C2410C','#0F7B6C','#9333B5','#B45309','#BE185D','#3F6212','#0E7490'];
const DAY=864e5;
const APP_URL=location.origin+location.pathname;
const DEFAULT_BRANDS=['Бадаевский','Дом спорта','Capital Group','Золотой','Роза Вельвет','Капиталист','Темп'];
const DEFAULT_COLORS={'Бадаевский':'#D7263D','Дом спорта':'#1E9E5A','Capital Group':'#1B2F6E','Роза Вельвет':'#C9A27E','Золотой':'#F2B705','Темп':'#7B3FC4','Капиталист':'#35A7E8'};
const WD=['вс','пн','вт','ср','чт','пт','сб'];
const MON=['янв','фев','мар','апр','мая','июн','июл','авг','сен','окт','ноя','дек'];

/* ============ helpers ============ */
const $=(s,el=document)=>el.querySelector(s);
function h(tag,attrs,...kids){
  const e=document.createElement(tag);
  for(const [k,v] of Object.entries(attrs||{})){
    if(v==null||v===false) continue;
    if(k==='class') e.className=v;
    else if(k==='text') e.textContent=v;
    else if(k==='style') e.style.cssText=v;
    else if(k.startsWith('on')&&typeof v==='function') e.addEventListener(k.slice(2),v);
    else e.setAttribute(k,v===true?'':v);
  }
  for(const kid of kids.flat()){ if(kid==null||kid===false) continue; e.append(kid.nodeType?kid:document.createTextNode(String(kid))); }
  return e;
}
const plural=(n,a,b,c)=>{n=Math.abs(n)%100;const m=n%10;if(n>10&&n<20)return c;if(m>1&&m<5)return b;if(m===1)return a;return c;};
const str=v=>typeof v==='string'?v:(v==null?'':String(v));
function dueTs(t){ if(!t.due||!/^\d{4}-\d{2}-\d{2}$/.test(t.due)) return null; const [y,m,d]=t.due.split('-').map(Number); const [hh,mm]=(/^\d{2}:\d{2}$/.test(t.dueTime||'')?t.dueTime:'23:59').split(':').map(Number); return new Date(y,m-1,d,hh,mm).getTime(); }
const sod=ts=>{const d=new Date(ts);d.setHours(0,0,0,0);return d.getTime();};
const isOver=t=>t.status!=='done'&&dueTs(t)!=null&&dueTs(t)<Date.now();
function fmtDue(t){
  const ts=dueTs(t); if(ts==null) return {text:'без срока',cls:'none'};
  const dd=Math.round((sod(ts)-sod(Date.now()))/DAY);
  const time=/^\d{2}:\d{2}$/.test(t.dueTime||'')?' '+t.dueTime:'';
  if(t.status==='done'){const d=new Date(ts);return {text:`${d.getDate()} ${MON[d.getMonth()]}`,cls:''};}
  if(ts<Date.now()){ const n=-dd; return {text: n<=0?`просрочено${time?',':''}${time}`:`просрочено ${n} ${plural(n,'день','дня','дней')}`,cls:'bad'}; }
  if(dd===0) return {text:'сегодня'+time,cls:'warn'};
  if(dd===1) return {text:'завтра'+time,cls:'soon'};
  const d=new Date(ts); return {text:`${WD[d.getDay()]}, ${d.getDate()} ${MON[d.getMonth()]}${time}`,cls:dd<=3?'soon':''};
}
function fmtWhen(ts){ if(!ts) return ''; const d=new Date(ts); const today=sod(Date.now()); const p=n=>String(n).padStart(2,'0'); const hm=`${p(d.getHours())}:${p(d.getMinutes())}`; if(sod(ts)===today) return 'сегодня '+hm; if(sod(ts)===today-DAY) return 'вчера '+hm; return `${d.getDate()} ${MON[d.getMonth()]} ${hm}`; }
function brandSym(name){ name=str(name).trim(); if(!name) return '—'; const w=name.split(/\s+/).filter(Boolean); if(w.length>1) return (w[0][0]+w[1][0]).toUpperCase(); const a=name[0].toUpperCase(); const rest=name.slice(1).toLowerCase(); const c=rest.match(/[бвгджзйклмнпрстфхцчшщbcdfghjklmnpqrstvwxz]/); return a+(c?c[0]:(rest[0]||'')); }
function brandColor(name){ const m=S.config&&S.config.brandColors; const c=m&&typeof m[name]==='string'&&/^#[0-9a-f]{6}$/i.test(m[name])?m[name]:DEFAULT_COLORS[name]; if(c) return c; const i=cfgBrands().indexOf(name); if(i>=0) return BRAND_HUES[i%BRAND_HUES.length]; let x=0; for(const ch of str(name)) x=(x*31+ch.charCodeAt(0))>>>0; return BRAND_HUES[x%BRAND_HUES.length]; }
function inkOn(hex){ const n=parseInt(hex.slice(1),16); const ch=[n>>16&255,n>>8&255,n&255].map(v=>{v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4);}); const L=.2126*ch[0]+.7152*ch[1]+.0722*ch[2]; return L>.35?'#17171B':'#FFFFFF'; }
function tint(hex,a){ const n=parseInt(hex.slice(1),16); return `rgba(${n>>16&255},${n>>8&255},${n&255},${a})`; }
const symEl=b=>{ const c=brandColor(b); return h('span',{class:'sym',style:`background:${c};border-color:${c};color:${inkOn(c)}`,'aria-hidden':'true',text:brandSym(b)}); };
function initials(n){ const p=str(n).trim().split(/\s+/).filter(Boolean); if(!p.length) return '?'; return (p[0][0]+(p[1]?p[1][0]:'')).toUpperCase(); }
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('on'); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('on'),2600); }
function errText(e){ if(e&&e.message&&e.code==='server') return e.message; const c=e&&e.code; if(c==='quota_exceeded') return 'База заполнена — удалите старые задачи'; if(c==='invalid_argument') return 'Нет прав на изменение доски'; if(c==='resource_exhausted') return 'Слишком часто — подождите секунду'; return 'Не получилось сохранить, попробуйте ещё раз'; }
async function retry(fn){ try{ return await fn(); }catch(e){ if(e&&(e.code==='unavailable'||!e.code)){ await new Promise(r=>setTimeout(r,400+Math.random()*600)); return fn(); } throw e; } }

/* ============ stores ============ */
class ServerStore{
  constructor(token){ this.token=token; this.tasks=new Map(); this.logs=new Map(); this.tl=new Set(); this.cl=new Set(); this.ll=new Map(); this.config=null; this.es=null; }
  async api(method,path,body){
    let r;
    try{ r=await fetch('/api'+path,{method,headers:{'Content-Type':'application/json','Authorization':'Bearer '+this.token},body:body?JSON.stringify(body):undefined}); }
    catch(e){ throw {code:'unavailable'}; }
    if(r.status===401){ logout(true); throw {code:'unauth'}; }
    let data=null; try{ data=await r.json(); }catch(e){}
    if(!r.ok) throw {code:'server',message:(data&&data.error)||'Ошибка сервера'};
    return data;
  }
  async load(){
    const st=await this.api('GET','/state');
    S.me=st.me.id; S.isOwner=st.admin!=null?!!st.admin:st.role==='designer'; S.role=st.admin?'admin':(st.role==='member'?'manager':st.role); S.myName=st.me.name;
    for(const u of st.users){ names[u.id]=u.name; S.urole[u.id]=u.role||'manager'; if(u.disabled) (S.disabledIds||(S.disabledIds=new Set())).add(u.id); }
    if(!S._dsgInit){ S._dsgInit=true; if(S.role==='designer'&&!S.isOwner) S.dsg=S.me; if(!S._viewFromHash&&(S.role==='head'||S.role==='manager')){ S.view='team'; try{history.replaceState(null,'','#team');}catch(e){} } }
    this.tasks=new Map(st.tasks.map(t=>[t.id,t])); this.config=st.config;
    this.emit(); this.emitCfg();
  }
  async start(){
    await this.load();
    this.connect();
  }
  connect(){
    if(this.es) this.es.close();
    const es=new EventSource('/api/events?token='+encodeURIComponent(this.token)); this.es=es;
    let opened=false;
    es.onopen=()=>{ if(opened){ this.load().catch(()=>{}); } opened=true; S.slow=false; renderNotes(); };
    es.onerror=()=>{ S.slow=true; renderNotes(); };
    es.onmessage=e=>{ let ev; try{ ev=JSON.parse(e.data); }catch(_){ return; }
      if(ev.type==='task'){ this.tasks.set(ev.task.id,ev.task); this.emit(); }
      else if(ev.type==='task-del'){ this.tasks.delete(ev.id); this.logs.delete(ev.id); this.emit(); }
      else if(ev.type==='config'){ this.config=Object.assign({},this.config,ev.config); this.emitCfg(); }
      else if(ev.type==='user'){ names[ev.user.id]=ev.user.name; S.urole[ev.user.id]=ev.user.role||'manager'; if(ev.user.disabled) (S.disabledIds||(S.disabledIds=new Set())).add(ev.user.id); else if(S.disabledIds) S.disabledIds.delete(ev.user.id); render(); }
      else if(ev.type==='log'){ const arr=this.logs.get(ev.taskId); if(arr&&!arr.some(x=>x.id===ev.entry.id)){ arr.push(ev.entry); this.emitLog(ev.taskId); } }
    };
  }
  emit(){ const a=[...this.tasks.values()]; this.tl.forEach(f=>f(a,false)); }
  emitCfg(){ this.cl.forEach(f=>f(this.config)); }
  emitLog(id){ const a=(this.logs.get(id)||[]).slice().sort((x,y)=>x.at-y.at); (this.ll.get(id)||new Set()).forEach(f=>f(a)); }
  subscribeTasks(next){ this.tl.add(next); setTimeout(()=>this.emit()); return ()=>this.tl.delete(next); }
  subscribeConfig(next){ this.cl.add(next); setTimeout(()=>next(this.config)); return ()=>this.cl.delete(next); }
  setConfig(data){ return this.api('PATCH','/config',data); }
  subscribeLog(id,next){
    if(!this.ll.has(id)) this.ll.set(id,new Set()); this.ll.get(id).add(next);
    this.api('GET','/tasks/'+id+'/log').then(arr=>{ const cur=this.logs.get(id)||[]; const m=new Map(arr.concat(cur).map(x=>[x.id,x])); this.logs.set(id,[...m.values()]); this.emitLog(id); }).catch(()=>toast('История задачи не загрузилась'));
    return ()=>{ const s=this.ll.get(id); if(s) s.delete(next); };
  }
  async create(data){ const t=await this.api('POST','/tasks',data); this.tasks.set(t.id,t); this.emit(); return t.id; }
  async update(id,patch){ const p=Object.assign({},patch); delete p.updatedAt; delete p.statusAt; delete p.doneAt; const t=await this.api('PATCH','/tasks/'+id,p); this.tasks.set(t.id,t); this.emit(); }

class DbStore{
  constructor(db){ this.db=db; this.q=new Map(); }
  chain(path,fn){ const p=(this.q.get(path)||Promise.resolve()).catch(()=>{}).then(()=>retry(fn)); this.q.set(path,p); return p; }
  subscribeTasks(next,err){ return this.db.collection('tasks').onSnapshot(s=>next(s.docs.filter(d=>d.exists).map(d=>({id:d.id,...d.data()})),s.metadata.fromCache),err); }
  subscribeConfig(next){ return this.db.doc('config/board').onSnapshot(s=>next(s.exists?s.data():null),()=>{}); }
  setConfig(data){ const ref=this.db.doc('config/board'); return this.chain(ref.path,()=>ref.set(data)); }
  subscribeLog(id,next){ return this.db.collection(`tasks/${id}/log`).orderBy('at').onSnapshot(s=>next(s.docs.map(d=>({id:d.id,...d.data()}))),()=>toast('История задачи не загрузилась')); }
  async create(data){ const ref=this.db.collection('tasks').doc(); await this.chain(ref.path,()=>ref.set(data)); return ref.id; }
  update(id,patch){ const ref=this.db.doc('tasks/'+id); return this.chain(ref.path,()=>ref.update(patch)); }
  async remove(id){ const logs=await this.db.collection(`tasks/${id}/log`).get(); for(const d of logs.docs){ await retry(()=>this.db.doc(`tasks/${id}/log/${d.id}`).delete()); } await this.chain('tasks/'+id,()=>this.db.doc('tasks/'+id).delete()); }
  log(id,entry){ const ref=this.db.collection(`tasks/${id}/log`).doc(); return retry(()=>ref.set(entry)); }
}
class LocalStore{
  constructor(){ this.K='elementar-planer-v1'; this.d={tasks:{},logs:{},config:{brands:DEFAULT_BRANDS.slice(),brandColors:{...DEFAULT_COLORS}}}; try{const s=localStorage.getItem(this.K); if(s) this.d=Object.assign(this.d,JSON.parse(s));}catch(e){} this.tl=new Set(); this.ll=new Map(); this.cl=new Set(); }
  save(){ try{localStorage.setItem(this.K,JSON.stringify(this.d));}catch(e){} }
  emit(){ const a=Object.entries(this.d.tasks).map(([id,t])=>({id,...t})); this.tl.forEach(f=>f(a,false)); }
  emitLog(id){ const a=(this.d.logs[id]||[]).slice().sort((x,y)=>x.at-y.at); (this.ll.get(id)||new Set()).forEach(f=>f(a)); }
  subscribeTasks(next){ this.tl.add(next); setTimeout(()=>this.emit()); return ()=>this.tl.delete(next); }
  subscribeConfig(next){ this.cl.add(next); setTimeout(()=>next(this.d.config)); return ()=>this.cl.delete(next); }
  async setConfig(data){ this.d.config=data; this.save(); this.cl.forEach(f=>f(data)); }
  subscribeLog(id,next){ if(!this.ll.has(id)) this.ll.set(id,new Set()); this.ll.get(id).add(next); setTimeout(()=>this.emitLog(id)); return ()=>this.ll.get(id).delete(next); }
  async create(data){ const id='t'+Date.now().toString(36)+Math.random().toString(36).slice(2,6); this.d.tasks[id]=data; this.save(); this.emit(); return id; }
  async update(id,patch){ if(!this.d.tasks[id]) return; Object.assign(this.d.tasks[id],patch); this.save(); this.emit(); }
  async remove(id){ delete this.d.tasks[id]; delete this.d.logs[id]; this.save(); this.emit(); }
  async log(id,entry){ (this.d.logs[id]||(this.d.logs[id]=[])).push({id:'l'+Date.now().toString(36)+Math.random().toString(36).slice(2,5),...entry}); this.save(); this.emitLog(id); }
}

async function moveTask(t,to,comment,kind){
  if(!S.canWrite) return;
  if(to==='work'&&t.status==='new'&&!t.size&&S.mode==='server'&&canExecT(t)){ return sizeSheet(t,async k=>{ await store.update(t.id,{size:k}); await store.log(t.id,{kind:'event',text:'Размер: '+sizeLabel(k),by:S.me,at:Date.now()}); await moveTask({...t,size:k},'work'); }); }
  const now=Date.now(); const patch={status:to,statusAt:now,updatedAt:now};
  if(to==='done') patch.doneAt=now;
  try{
    await store.update(t.id,patch);
    await store.log(t.id,{kind:'event',text:`${ST_NAME[t.status]} → ${ST_NAME[to]}`,by:S.me,at:now});
    if(comment) await store.log(t.id,{kind:kind==='return'?'return':'comment',text:comment,by:S.me,at:now+1});
  }catch(e){ toast(errText(e)); }
}

    D.askOpen=true;
    A.replaceChildren(h('div',{class:'ask on'},h('label',{class:'res-k'},'Сколько займёт задача?'),
      sizePicker(t.size,async k=>{ try{ await after(k); }catch(e){ toast(errText(e)); } D.askOpen=false; refreshDrawer(); }),
      h('div',{style:'display:flex;gap:8px'},h('button',{class:'btn ghost',onclick:()=>{D.askOpen=false;renderActions(t);}},'Отмена'))));
  };
  const btns=[];
  if(canTake) btns.push(h('button',{class:'btn primary',onclick:()=>askSize(async k=>{ await store.update(t.id,{assignee:S.me,size:k}); await store.log(t.id,{kind:'event',text:'Взял(а) задачу себе · размер '+sizeLabel(k),by:S.me,at:Date.now()}); if(t.status==='new') await moveTask({...t,assignee:S.me,size:k},'work'); })},t.status==='new'?'Взять себе в работу':'Взять себе'));
  else if(t.status==='new'&&exec&&(t.assignee||S.mode!=='server')) btns.push(h('button',{class:'btn primary',onclick:()=>askSize(async k=>{ await store.update(t.id,{size:k}); await store.log(t.id,{kind:'event',text:'Размер: '+sizeLabel(k),by:S.me,at:Date.now()}); await moveTask({...t,size:k},'work'); })},'Взять в работу'));
  if(t.status==='work'&&exec&&(t.assignee||S.mode!=='server')&&!t.size&&S.mode==='server'){
    A.replaceChildren(h('div',{class:'ask on size-need'},h('label',{class:'res-k'},'Оцени размер работы — без этого задачу не сдать'),
      sizePicker('',async k=>{ try{ await store.update(t.id,{size:k}); await store.log(t.id,{kind:'event',text:'Размер: '+sizeLabel(k),by:S.me,at:Date.now()}); }catch(e){ toast(errText(e)); } refreshDrawer(); })));
    return;
  }
  if(t.status==='work'&&exec&&(t.assignee||S.mode!=='server')) btns.push(h('button',{class:'btn primary',onclick:()=>askReview(t)},'Сдать на проверку'));
  if(t.status==='review'&&req){
    btns.push(h('button',{class:'btn ok',onclick:()=>moveTask(t,'done')},'✓ Принять'));
  }
  if(t.status==='done'&&req) btns.push(h('button',{class:'btn',onclick:()=>askThen('Что ещё нужно сделать','Вернуть в работу',true,v=>moveTask(t,'work',v,'return'))},'Вернуть в работу'));
  if(!btns.length&&t.status==='review') btns.push(h('span',{class:'ro'},'Ждёт решения постановщика'));
  if(!btns.length&&t.status==='new'&&!t.assignee) btns.push(h('span',{class:'ro'},'Ждёт, когда задачу возьмёт дизайнер'));
  A.append(...btns,h('span',{class:'spacer'}),h('button',{class:'btn copy-task',onclick:e=>copyTaskLink(t,e.currentTarget)},'🔗 Ссылка на задачу'));
}

/* ============ wiring ============ */
for(const b of $('#tabs').children) b.onclick=()=>{ S.view=b.dataset.v; if(S.fromTeam){ S.dsg=null; S.fromTeam=false; } try{history.replaceState(null,'','#'+S.view);}catch(e){location.hash=S.view;} render(); };
function taskHashFull(id){ return 't-'+String(id).replace(/[^A-Za-z0-9-]/g,c=>'-'+c.charCodeAt(0).toString(36)+'-'); }
function taskHash(id){ return S.mode==='server'?taskHashFull(id):taskHashFull(id).slice(0,8); }
function findByHash(v){ return S.tasks.find(x=>taskHashFull(x.id)===v)||S.tasks.find(x=>taskHash(x.id)===v); }
function setHash(v){ try{ history.replaceState(null,'','#'+v); }catch(e){ S._ignoreHash=true; location.hash=v; } }
function fromHash(){ const v=location.hash.slice(1);
  if(v.startsWith('t-')){ const t=findByHash(v); if(t){ if(D.id!==t.id) openTask(t.id); } else S.pendingTask=v; return; }
  if(['board','list','load','team'].includes(v)){ S.view=v; S._viewFromHash=true; } }
window.addEventListener('hashchange',()=>{ if(S._ignoreHash){ S._ignoreHash=false; return; } fromHash(); render(); });
async function copyTaskLink(t,btn){
  const url=APP_URL+'#'+taskHash(t.id); const label=btn.textContent;
  try{ await navigator.clipboard.writeText(url); btn.textContent='✓ Ссылка скопирована'; btn.classList.add('done'); setTimeout(()=>{ btn.textContent=label; btn.classList.remove('done'); },2000); }
  catch(e){ const inp=h('input',{class:'link-inp',readonly:true,value:url,onclick:ev=>ev.target.select()}); btn.replaceWith(inp); inp.focus(); inp.select(); toast('Ссылка выделена — нажмите ⌘C'); }
}
fromHash();
let qT; $('#q').addEventListener('input',e=>{ clearTimeout(qT); qT=setTimeout(()=>{S.q=e.target.value;renderMain();},120); });
$('#newBtn').onclick=openNew;
setInterval(()=>{ if(S.loaded&&!D.mode) render(); },60000);
render(); boot();
</script>
</body>
